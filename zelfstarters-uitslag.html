<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Je uitslag · Zelfstartregister</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://zelfstarters.nl/icoon-256.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1f3d;--ink:#121826;--muted:#5b6478;--paper:#f6f4ef;--orange:#ff6a2b;--orange-dark:#e2561c;--sand:#f1e9db;--line:#e3dfd6}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
.w{max-width:640px;margin:0 auto;padding:30px 20px 60px}
.brand{display:flex;align-items:center;gap:10px;font-family:Outfit,sans-serif;font-weight:800;text-decoration:none;color:var(--ink);font-size:1.1rem}
.brand small{display:block;font-family:Nunito;font-weight:600;font-size:.68rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
h1{font-family:Outfit,sans-serif;font-size:1.8rem;line-height:1.1;margin:28px 0 6px}
h2{font-family:Outfit,sans-serif;font-size:1.2rem;margin:0 0 10px}
.m{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:26px;margin-top:18px}
.score{display:flex;align-items:center;gap:22px}
.score .n{font-family:Outfit,sans-serif;font-weight:800;font-size:4rem;line-height:1;color:var(--navy)}
.score .c{font-size:.85rem;color:var(--muted)}
.ring{display:flex;align-items:center;gap:12px;margin:10px 0}
.ring i{width:14px;height:14px;border-radius:50%;background:var(--orange);display:inline-block;flex:none}
.ring i.grijs{background:#d9d3c6}
.ring .t{font-size:.98rem}
.ring .t b{font-family:Outfit,sans-serif}
.ring .s{font-family:Outfit,sans-serif;font-weight:700;color:var(--navy);margin-left:auto}
.badge{display:flex;align-items:center;gap:20px}
.stamp{display:inline-flex;align-items:center;gap:8px;background:var(--navy);color:#fff;padding:7px 13px;border-radius:999px;font-size:.82rem;font-weight:700}
.stamp.grijs{background:#d9d3c6;color:var(--navy)}
.jaar{font-family:Outfit,sans-serif;font-weight:700;color:var(--navy);letter-spacing:.08em;margin-top:8px}
.btn{display:inline-block;background:var(--orange);color:#fff;border:0;padding:14px 24px;border-radius:14px;font-family:Outfit,sans-serif;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--orange-dark)}
.btn.blauw{background:var(--navy)}
.btn[disabled]{opacity:.6;cursor:wait}
.optie{border:2px solid var(--line);border-radius:18px;padding:18px 20px;margin-top:12px;background:#fff}
.optie.hi{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange)}
.optie .kop{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.optie .nr{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.optie h3{font-family:Outfit,sans-serif;font-size:1.1rem;margin:2px 0 0}
.optie .p{font-family:Outfit,sans-serif;font-weight:800;color:var(--navy);font-size:1.3rem;white-space:nowrap}
.optie .p small{display:block;font-family:Nunito;font-weight:600;color:var(--muted);font-size:.75rem;text-align:right}
.optie ul{padding-left:18px;margin:8px 0 12px;color:var(--muted);font-size:.93rem}
.optie .btn{width:100%;text-align:center}
ul.lijst{padding-left:20px;color:var(--muted);margin:10px 0 0;font-size:.95rem}
.duiding{white-space:pre-line;font-size:.98rem}
.plan .rij{border-top:1px solid var(--line);padding:14px 0}
.plan label{display:block;font-weight:700;font-size:.9rem;margin:6px 0}
.plan select,.plan input{width:100%;padding:11px 12px;border:2px solid var(--line);border-radius:12px;font:inherit;font-size:.98rem;background:#fff}
.fout{color:#b23b0a;font-weight:700;margin-top:10px;display:none}
.foot{font-size:.85rem;color:var(--muted);margin-top:18px}
@media(max-width:480px){.keuze{grid-template-columns:1fr}.score .n{font-size:3.2rem}}
</style>
</head>
<body><div class="w">
<a class="brand" href="https://zelfstarters.nl"><svg width="34" height="34" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#0f1f3d"/><circle cx="20" cy="20" r="13" fill="#fff"/><circle cx="20" cy="20" r="8" fill="#ff6a2b"/><circle cx="20" cy="20" r="3" fill="#fff"/></svg><span>Zelfstarters<small>De ontwikkelstructuur voor zelfstandige professionals</small></span></a>
<div id="inhoud"><h1>Even kijken</h1><p class="m">We halen je uitslag op.</p></div>
</div>
<script>
(async function(){
  const z = new URLSearchParams(location.search).get("z") || "";
  const el = document.getElementById("inhoud");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
  const NAAM = { zien: "Zien", sturen: "Sturen", doen: "Doen" };

  function badgeSvg(plus, jaren, grijs){
    const j = (jaren || []).join(" · ");
    return `<svg width="110" height="${j ? 138 : 110}" viewBox="0 0 120 ${j ? 150 : 120}"><g${grijs ? ' opacity="0.35"' : ""}><circle cx="60" cy="60" r="58" fill="#16294f"/><circle cx="60" cy="60" r="43" fill="#fff"/><circle cx="60" cy="60" r="30" fill="#ff6a2b"/><circle cx="60" cy="60" r="16" fill="#fff"/><circle cx="60" cy="60" r="6" fill="#0f1f3d"/>${plus ? '<circle cx="98" cy="22" r="20" fill="#ff6a2b" stroke="#fff" stroke-width="5"/><rect x="94.5" y="10" width="7" height="24" rx="2.5" fill="#fff"/><rect x="86" y="18.5" width="24" height="7" rx="2.5" fill="#fff"/>' : ""}</g>${j ? `<text x="60" y="142" text-anchor="middle" font-family="Outfit,Helvetica,Arial,sans-serif" font-weight="700" font-size="13" fill="#0f1f3d">${j}</text>` : ""}</svg>`;
  }

  async function haal(){
    const r = await fetch("/api/zelfstarters-uitslag?z=" + encodeURIComponent(z));
    if (!r.ok) throw new Error("niet gevonden");
    return r.json();
  }

  function scoreBlok(d){
    const ruimteHtml = d.ruimte.map((p, i) => `<div class="ring"><i class="grijs"></i><span class="t">${esc(p.zin)}</span></div>`).join("");
    return `<div class="card">
      <div class="score"><div class="n">${esc(d.score)}</div><div><div style="font-family:Outfit,sans-serif;font-weight:700">Je zelfkrachtscore</div><div class="c">Op eigenaarschap, initiatief en daadkracht, langs Zien, Sturen en Doen. Dit getal is van jou; het staat nergens openbaar.</div></div></div>
      <div style="margin-top:18px"><div class="ring"><i></i><span class="t"><b>${esc(d.sterkste.zin)}</b></span></div>${ruimteHtml}</div>
    </div>`;
  }

  function gratis(d){
    const pr = d.prijzen || {};
    const prijs = t => pr[t] ? `€ ${pr[t].ex}<small>excl. btw, + € ${pr[t].btw} btw = € ${pr[t].totaal}</small>` : "";
    el.innerHTML = `<h1>${esc(d.voornaam)}, je staat in het register</h1>
      <p class="m">Nummer <b>${esc(d.nummer)}</b>, geregistreerd. Dit is wat jij nu weet.</p>
      ${scoreBlok(d)}
      <div class="card">
        <div class="badge">${badgeSvg(false, [], true)}<div><span class="stamp grijs">Geregistreerd, nog niet geverifieerd</span><div class="m" style="font-size:.9rem;margin-top:8px">Een opdrachtgever ziet nu alleen je nummer. Wat erbij komt als je je jaar doet, staat hieronder.</div></div></div>
      </div>
      <div class="card" id="verifieer">
        <h2>Kies hoe je verdergaat</h2>
        <p class="m" style="margin:0">Je staat geregistreerd. Dat blijft zo, ook als je niets kiest. Wil je weten wat je ruimte precies is en wat je ermee doet, en wil je dat een opdrachtgever het kan controleren, dan kies je optie 2 of 3.</p>
        <div class="optie">
          <div class="kop"><div><div class="nr">Optie 1</div><h3>Geregistreerd blijven</h3></div><div class="p">Gratis</div></div>
          <ul><li>Je nummer in het register, zonder jaartal</li><li>Je score, je sterkste kant en je ruimte, zoals hierboven</li></ul>
          <div class="m" style="font-size:.9rem">Je hoeft niets te doen. Over een jaar nodigen we je uit om opnieuw te meten.</div>
        </div>
        <div class="optie" id="optie-jaar">
          <div class="kop"><div><div class="nr">Optie 2</div><h3>Je jaar in de ontwikkelstructuur</h3></div><div class="p">${prijs("standaard")}</div></div>
          <ul><li>Geverifieerd: je badge met het jaartal ${esc(d.jaar)}, controleerbaar door elke opdrachtgever</li><li>De volledige duiding van je meting</li><li>Je als-dan plan met herinneringen op de momenten die ertoe doen</li><li>Je hermeting over een jaar, met je groei op de badge</li></ul>
          <button class="btn" data-type="standaard">Kies je jaar</button>
        </div>
        <div class="optie" id="optie-plus">
          <div class="kop"><div><div class="nr">Optie 3</div><h3>Je jaar met Plus Class</h3></div><div class="p">${prijs("plus")}</div></div>
          <ul><li>Alles van optie 2</li><li>Een dag live in Zaltbommel in januari: je meting wordt je persoonlijke ontwikkelplan, met een gedragsexpert en vakgenoten</li><li>De plus op je badge</li></ul>
          <button class="btn" data-type="plus">Kies Plus Class</button>
        </div>
        <div class="fout" id="vfout"></div>
        <p class="foot">Founding-tarief tot 31 december. Wie dit jaar kiest, draagt ${esc(d.jaar)} als eerste jaartal op zijn badge; dat jaartal is er volgend jaar niet meer. Je betaalt via Mollie en komt terug op deze pagina.</p>
      </div>`;
    const keuze = new URLSearchParams(location.search).get("keuze");
    const hi = keuze === "plus" ? document.getElementById("optie-plus") : keuze === "jaar" ? document.getElementById("optie-jaar") : null;
    if (hi){ hi.classList.add("hi"); setTimeout(() => hi.scrollIntoView({ behavior: "smooth", block: "center" }), 400); }
    const fout = document.getElementById("vfout");
    document.querySelectorAll("#verifieer button[data-type]").forEach(knop => knop.addEventListener("click", async function(){
      fout.style.display = "none"; const tekst = knop.textContent; knop.disabled = true; knop.textContent = "Even geduld";
      try{
        const r = await fetch("/api/zelfstarters-verifieer", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ z, type: knop.dataset.type }) });
        const j = await r.json();
        if (!r.ok || !j.betaalpagina) throw new Error(j.error || "De betaling kon niet worden gestart.");
        location.href = j.betaalpagina;
      }catch(err){ fout.textContent = err.message; fout.style.display = "block"; knop.disabled = false; knop.textContent = tekst; }
    }));
  }

  function geverifieerd(d){
    const plan = d.plan || [];
    const momentOpties = sel => d.momenten.map(m => `<option value="${m.code}"${sel === m.code ? " selected" : ""}>${esc(m.label)}</option>`).join("");
    const rijen = d.ruimte.map((p, i) => {
      const r = plan[i] || {};
      return `<div class="rij"><div style="font-family:Outfit,sans-serif;font-weight:700;color:var(--navy)">${esc(p.naam)}</div><div class="m" style="font-size:.92rem">${esc(p.zin)}</div>
        <label>Als</label><select name="moment${i}"><option value="">kies het moment</option>${momentOpties(r.moment)}</select>
        <label>dan</label><input type="text" name="actie${i}" maxlength="240" placeholder="wat je dan doet, in één zin" value="${esc(r.actie || "")}"></div>`;
    }).join("");
    el.innerHTML = `<h1>${esc(d.voornaam)}, je bent geverifieerd</h1>
      <p class="m">Nummer <b>${esc(d.nummer)}</b>. Je badge draagt ${esc((d.meetjaren || []).join(" · "))}.</p>
      <div class="card"><div class="badge">${badgeSvg(d.plus, d.meetjaren, false)}<div><span class="stamp">Geverifieerd${d.plus ? " · Plus" : ""}</span><div class="m" style="font-size:.9rem;margin-top:8px">Controlepagina: <a href="https://scan.happly.nl/zs/${esc(d.nummer)}" style="color:var(--navy);font-weight:700">scan.happly.nl/zs/${esc(d.nummer)}</a>. Je badge en de link staan ook in je mail.</div>
        ${d.plus_gekozen && !d.plus ? `<div style="margin-top:12px"><a class="btn blauw" href="/zelfstarters/dag?z=${encodeURIComponent(z)}">Kies je Plus Class-dag</a></div>` : ""}</div></div></div>
      ${scoreBlok(d)}
      <div class="card"><h2>Wat je meting laat zien</h2><div class="duiding">${esc(d.duiding || "Je duiding wordt nog geschreven. Kijk straks nog eens, of in je mail.")}</div></div>
      <div class="card plan"><h2>Je als-dan plan</h2><p class="m" style="margin:0 0 6px">Per punt één moment dat ertoe doet, en wat je dan doet. Je krijgt op die momenten een herinnering.</p>
        <form id="pf">${rijen}<button class="btn" id="pknop" type="submit" style="width:100%;margin-top:14px">${plan.length ? "Werk je plan bij" : "Leg je plan vast"}</button><div class="fout" id="pfout"></div></form>
        ${plan.length ? `<p class="foot">Vastgelegd. Je plan staat ook in je mail.</p>` : ""}
      </div>`;
    const f = document.getElementById("pf"), knop = document.getElementById("pknop"), fout = document.getElementById("pfout");
    f.addEventListener("submit", async function(e){
      e.preventDefault(); fout.style.display = "none"; knop.disabled = true;
      const regels = d.ruimte.map((p, i) => ({ dimensie: p.dimensie, moment: f["moment" + i].value, actie: f["actie" + i].value }));
      try{
        const r = await fetch("/api/zelfstarters-uitslag", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ z, plan: regels }) });
        const j = await r.json();
        if (!r.ok) throw new Error(j.error || "Opslaan is niet gelukt.");
        d.plan = j.plan; geverifieerd(d); window.scrollTo(0, document.body.scrollHeight);
      }catch(err){ fout.textContent = err.message; fout.style.display = "block"; knop.disabled = false; }
    });
  }

  try{
    let d = await haal();
    // Terug van Mollie: even wachten tot de betaling bekend is.
    for (let i = 0; i < 5 && !d.geverifieerd && d.betaling_status === "open"; i++){
      el.innerHTML = `<h1>Even kijken</h1><p class="m">We halen de stand van je betaling op.</p>`;
      await new Promise(r => setTimeout(r, 1500)); d = await haal();
    }
    if (!d.gemeten){
      el.innerHTML = `<h1>Eerst je meting</h1><p class="m">Je registratie staat klaar, maar je meting is nog niet binnen.</p><a class="btn" href="/scan?zs=${encodeURIComponent(z)}">Doe je meting</a>`;
      return;
    }
    if (d.geverifieerd) geverifieerd(d); else gratis(d);
  }catch(e){
    el.innerHTML = `<h1>Niet gevonden</h1><p class="m">We konden deze registratie niet vinden. Mail naar info@zelfstarters.nl, dan kijken we mee.</p>`;
  }
})();
</script>
</body>
</html>
