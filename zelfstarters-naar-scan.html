<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naar je meting · Zelfstartregister</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://zelfstarters.nl/icoon-256.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1f3d;--ink:#121826;--muted:#5b6478;--paper:#f6f4ef;--orange:#ff6a2b;--line:#e3dfd6;--magenta:#d6336c}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--paper);color:var(--ink);line-height:1.55}
.w{max-width:560px;margin:0 auto;padding:36px 20px 60px}
.brand{display:flex;align-items:center;gap:10px;font-family:Outfit,sans-serif;font-weight:800;text-decoration:none;color:var(--ink);font-size:1.15rem}
.brand small{display:block;font-family:Nunito;font-weight:600;font-size:.7rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
h1{font-family:Outfit,sans-serif;font-size:1.9rem;line-height:1.1;margin:30px 0 8px}
.m{color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;margin-top:22px}
.btn{display:inline-block;background:var(--orange);color:#fff;padding:15px 28px;border-radius:14px;font-family:Outfit,sans-serif;font-weight:700;font-size:1.05rem;text-decoration:none;margin-top:16px}
.stap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:18px;font-size:.85rem}
.stap div{background:var(--paper);border-radius:14px;padding:12px}
.stap b{font-family:Outfit,sans-serif;display:block;color:var(--navy)}
.happly{display:flex;align-items:center;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:.9rem;color:var(--muted)}
.happly img{width:28px;height:28px;flex:none;display:block}
@media(max-width:480px){.stap{grid-template-columns:1fr}}
</style>
</head>
<body><div class="w">
<a class="brand" href="https://zelfstarters.nl"><svg width="36" height="36" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#0f1f3d"/><circle cx="20" cy="20" r="13" fill="#fff"/><circle cx="20" cy="20" r="8" fill="#ff6a2b"/><circle cx="20" cy="20" r="3" fill="#fff"/></svg><span>Zelfstarters<small>De ontwikkelstructuur voor zelfstandige professionals</small></span></a>
<div id="inhoud"><h1>Even kijken</h1><p class="m">We halen je registratie op.</p></div>
</div>
<script>
(async function(){
  const z = new URLSearchParams(location.search).get("z") || "";
  const el = document.getElementById("inhoud");
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
  let d = null;
  for (let i = 0; i < 8; i++){
    try{ const r = await fetch("/api/zelfstarters-status?z=" + encodeURIComponent(z)); d = await r.json(); }catch(e){}
    if (d && d.status && !(d.status === "open" && d.betaling_open)) break;
    el.innerHTML = '<h1>Even kijken</h1><p class="m">We halen de stand van je betaling op.</p>';
    await new Promise(r => setTimeout(r, 1500));
  }
  if (!d || !d.status){
    el.innerHTML = '<h1>Dat ging niet goed</h1><p class="m">We konden je registratie niet vinden. Mail naar info@zelfstarters.nl, dan kijken we mee.</p>'; return;
  }
  if (d.status === "mislukt" || d.status === "verlopen"){
    el.innerHTML = '<h1>De betaling is niet doorgegaan</h1><p class="m">Er is niets afgeschreven. <a href="/zelfstarters?keuze=' + (d.type === "plus" ? "plus" : "jaar") + '" style="color:var(--navy);font-weight:700">Probeer het opnieuw</a>, of <a href="/zelfstarters" style="color:var(--navy);font-weight:700">registreer je gratis</a>.</p>'; return;
  }
  if (d.gemeten){
    el.innerHTML = '<h1>Je meting is al binnen</h1><p class="m">Je uitslag staat klaar.</p><a class="btn" href="/zelfstarters-uitslag?z=' + encodeURIComponent(z) + '">Naar je uitslag</a>'; return;
  }
  const betaald = d.status === "betaald";
  el.innerHTML = '<h1>' + (betaald ? "Gelukt, " + esc(d.voornaam) + ". Nu je meting" : "Je staat ingeschreven, " + esc(d.voornaam)) + '</h1>' +
    '<p class="m">' + (betaald ? "Je betaling is binnen en je registratienummer is " + esc(d.nummer || "") + ". " : "") + 'Nog één stap: je eerste meting.</p>' +
    '<div class="card"><p style="margin:0 0 6px"><b>Je gaat nu naar de Zelfkracht Scan van Happly.</b> Dat is het meetinstrument achter het Zelfstartregister. Het ziet er anders uit (andere kleuren, het logo van Happly), maar het is dezelfde registratie: na de meting kom je hier terug met je uitslag en je nummer.</p>' +
    '<div class="stap"><div><b>Tien minuten</b>Twaalf vragen en drie over je situatie.</div><div><b>In één keer</b>Je eigen antwoorden, geen test die je kunt halen.</div><div><b>Daarna terug</b>Je uitslag, je nummer' + (betaald ? ", je badge" : "") + '.</div></div>' +
    '<a class="btn" href="' + d.scan_url + '">Start de Zelfkracht Scan</a>' +
    '<div class="happly"><img src="/favicon.svg" alt="Happly"><span>De Zelfkracht Scan is van Happly, de bouwer achter Zelfstarters.</span></div></div>' +
    (betaald && d.type === "plus" ? '<div class="card"><p>Je hebt Verificatie & Voorkeur + Plus Class. Kies alvast je dag in januari, of doe dat later via de link in je mail.</p><a class="btn" style="background:var(--navy)" href="/zelfstarters-dag?z=' + encodeURIComponent(z) + '">Kies je dag</a></div>' : '');
})();
</script>
</body>
</html>
