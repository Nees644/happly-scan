<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kies je dag · Plus Class</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://zelfstarters.nl/icoon-256.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:#f6f4ef;color:#121826;line-height:1.55}
.w{max-width:560px;margin:0 auto;padding:36px 20px 60px}
.brand{display:flex;align-items:center;gap:10px;font-family:Outfit,sans-serif;font-weight:800;text-decoration:none;color:#121826;font-size:1.15rem}
h1{font-family:Outfit,sans-serif;font-size:1.9rem;line-height:1.1;margin:30px 0 8px}
.m{color:#5b6478}
.dag{display:flex;justify-content:space-between;align-items:center;background:#fff;border:2px solid #e3dfd6;border-radius:16px;padding:16px 18px;margin-top:12px;cursor:pointer;width:100%;font:inherit;text-align:left}
.dag b{font-family:Outfit,sans-serif;font-size:1.05rem}
.dag.gekozen{border-color:#ff6a2b;outline:2px solid #ff6a2b}
.dag[disabled]{opacity:.5;cursor:not-allowed}
.tag{font-size:.85rem;color:#5b6478}
.melding{margin-top:18px;font-weight:700}
</style>
</head>
<body><div class="w">
<a class="brand" href="https://zelfstarters.nl"><svg width="36" height="36" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#0f1f3d"/><circle cx="20" cy="20" r="13" fill="#fff"/><circle cx="20" cy="20" r="8" fill="#ff6a2b"/><circle cx="20" cy="20" r="3" fill="#fff"/></svg><span>Zelfstarters</span></a>
<h1 id="kop">Kies je dag</h1>
<p class="m" id="sub">Eén dag met je Plus Class in Zaltbommel. Je profiel vertaald naar je pitch, je als-dan plan onder begeleiding, je eerste honderd dagen uitgewerkt.</p>
<div id="dagen"></div>
<div class="melding" id="melding"></div>
</div>
<script>
(async function(){
  const z = new URLSearchParams(location.search).get("z") || "";
  const el = document.getElementById("dagen"), melding = document.getElementById("melding");
  async function laad(){
    const r = await fetch("/api/zelfstarters-dag?z=" + encodeURIComponent(z));
    const d = await r.json();
    if (!r.ok){ el.innerHTML = '<p class="m">' + (d.error || "Deze link werkt niet.") + ' Mail naar info@zelfstarters.nl.</p>'; return; }
    if (d.voornaam) document.getElementById("kop").textContent = "Kies je dag, " + d.voornaam;
    el.innerHTML = "";
    d.dagen.forEach(function(dag){
      const b = document.createElement("button");
      b.className = "dag" + (d.keuze === dag.datum ? " gekozen" : "");
      b.disabled = !dag.open && d.keuze !== dag.datum;
      b.innerHTML = "<span><b>" + dag.label + "</b><br><span class='tag'>" + dag.plaats + "</span></span><span class='tag'>" +
        (d.keuze === dag.datum ? "jouw dag" : (dag.open ? "plaatsen beschikbaar" : "vol")) + "</span>";
      b.addEventListener("click", async function(){
        if (d.keuze === dag.datum) return;
        melding.textContent = "Even opslaan";
        const p = await fetch("/api/zelfstarters-dag", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ z: z, datum: dag.datum }) });
        const u = await p.json();
        melding.textContent = p.ok ? "Vastgelegd: " + dag.label + ". De bevestiging staat in je mail." : (u.error || "Dat lukte niet.");
        await laad();
      });
      el.appendChild(b);
    });
  }
  await laad();
})();
</script>
</body>
</html>
