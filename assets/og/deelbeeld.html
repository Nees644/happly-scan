<!DOCTYPE html>
<html lang="nl"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#F7F3F0;
       font-family:"DM Sans",system-ui,sans-serif;color:#1A0B2E;display:flex}
  .tekst{width:560px;padding:70px 0 70px 72px;display:flex;flex-direction:column;justify-content:center}

  h1{font-family:"DM Serif Display",Georgia,serif;font-size:56px;line-height:1.05;font-weight:400;margin-bottom:24px}
  p{font-size:21px;line-height:1.45;color:#6B6472;max-width:44ch}
  .beeld{flex:1;display:flex;align-items:center;justify-content:center;padding-right:96px}
  .beeld svg{width:100%;height:auto;max-height:470px}
  .voet{position:absolute;left:72px;bottom:46px;font-size:16px;letter-spacing:1px;color:#6B6472}
</style></head>
<body>
  <div class="tekst">
    <div class="eyebrow">Teamkracht Index</div>
    <h1>Zien, kiezen,<br>en het dan ook doen</h1>
    <p>Eén beeld van waar een team staat op eigenaarschap, en wat er is verschoven als je opnieuw meet.</p>
    <div class="voet">teamkrachtindex.nl</div>
  </div>
  <div class="beeld"><svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Teamkrachtkaart: de keten zien, sturen en doen van dit team naast het gemiddelde"><line x1="150" y1="60" x2="150" y2="540" stroke="#E2D8D2" stroke-width="2"/><text x="150" y="570" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#6B6472">ZIEN</text><line x1="90" y1="303.2" x2="210" y2="303.2" stroke="#D6026F" stroke-width="3" opacity=".8"/><line x1="400" y1="60" x2="400" y2="540" stroke="#E2D8D2" stroke-width="2"/><text x="400" y="570" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#6B6472">STUREN</text><line x1="340" y1="348" x2="460" y2="348" stroke="#D6026F" stroke-width="3" opacity=".8"/><line x1="650" y1="60" x2="650" y2="540" stroke="#E2D8D2" stroke-width="2"/><text x="650" y="570" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#6B6472">DOEN</text><line x1="590" y1="380" x2="710" y2="380" stroke="#D6026F" stroke-width="3" opacity=".8"/><text x="716" y="384" font-family="DM Sans, sans-serif" font-size="11" letter-spacing="1" fill="#D6026F">GEMIDDELDE</text><polyline points="150,275.7 400,372.3 650,383.2" fill="none" stroke="#1A0B2E" stroke-width="5" stroke-linejoin="round"/><circle cx="150" cy="275.7" r="9" fill="#1A0B2E" stroke="#fff" stroke-width="3"/><circle cx="400" cy="372.3" r="9" fill="#1A0B2E" stroke="#fff" stroke-width="3"/><circle cx="650" cy="383.2" r="9" fill="#1A0B2E" stroke="#fff" stroke-width="3"/><text x="130" y="280.7" text-anchor="end" font-family="DM Sans, sans-serif" font-size="13" font-weight="600" fill="#1A0B2E">team</text><text x="275" y="298" text-anchor="middle" font-family="DM Serif Display, serif" font-style="italic" font-size="16" fill="#D6026F">hier zakt de keten</text></svg></div>
